name: Deploy SkyTeam to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyteam-cloudflare
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run the site locally and test every flow
        run: |
          export TERMINAL_SSO_SECRET="$(openssl rand -hex 32)"
          printf 'SESSION_SECRET=%s\nDEV_SHOW_CODES=1\nTERMINAL_SSO_SECRET=%s\n' "$(openssl rand -hex 32)" "$TERMINAL_SSO_SECRET" > .dev.vars
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/leads/token >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8787 node --test tests/*.test.mjs || { cat wrangler.log; exit 1; }

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."; exit 1; fi
          npx wrangler whoami
      - name: Create the database the first time, then point the config at it
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="skyteam-db");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create skyteam-db
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));process.stdout.write(l.find(x=>x.name==="skyteam-db").uuid)')
          fi
          echo "Database: $id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Set server secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TERMINAL_SSO_SECRET: ${{ secrets.TERMINAL_SSO_SECRET }}
        run: |
          existing=$(npx wrangler secret list --format json)
          if ! echo "$existing" | grep -q '"SESSION_SECRET"'; then
            openssl rand -hex 32 | npx wrangler secret put SESSION_SECRET
          fi
          if [ -n "$TERMINAL_SSO_SECRET" ]; then
            printf '%s' "$TERMINAL_SSO_SECRET" | npx wrangler secret put TERMINAL_SSO_SECRET
          else
            echo "::warning::TERMINAL_SSO_SECRET is not set yet, so the Premium Beta 'Open Smart Terminal' button stays off."
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "::warning::RESEND_API_KEY is not set yet, so sign-in codes can't be emailed."
          fi
      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          url="${{ steps.deploy.outputs.url }}"
          sleep 5
          curl -sf "$url/" -o /dev/null && echo "Home page OK"
          curl -sf "$url/members" -o /dev/null && echo "Member Hub OK"
          curl -sf "$url/api/leads/token" | grep -q token && echo "Registration API OK"
          echo "### Live test address: $url" >> "$GITHUB_STEP_SUMMARY"
