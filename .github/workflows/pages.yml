name: Publish Sky Team landing page

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyteam-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check registration flow
        run: |
          node --check public/lead-form.js
          node --check public/overview-player.js
          node --test tests/registration-flow.mjs
      - name: Export and verify landing page
        run: |
          node scripts/export-pages.mjs
          node --test tests/pages-export.mjs
      - name: Upload static landing page
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish landing page
        id: deployment
        uses: actions/deploy-pages@v4
